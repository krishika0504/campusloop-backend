version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusloop-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: campusloop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: campusloop-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/campusloop_db?schema=public
      JWT_SECRET: campusloop_production_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
